name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell-smoke:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run PowerShell 7 parser and smoke tests
        shell: pwsh
        run: ./Tests/Smoke.Tests.ps1

      - name: Run PowerShell 7 console regression tests
        shell: pwsh
        run: ./Tests/ConsoleFix.Tests.ps1

      - name: Run PowerShell 7 stability tests
        shell: pwsh
        run: ./Tests/Stability.Tests.ps1

      - name: Run Windows PowerShell 5.1 package compatibility tests
        shell: powershell
        run: ./Tests/PackageCompatibility.Tests.ps1

      - name: Run Windows PowerShell 5.1 console regression tests
        shell: powershell
        run: ./Tests/ConsoleFix.Tests.ps1

      - name: Run Windows PowerShell 5.1 stability tests
        shell: powershell
        run: ./Tests/Stability.Tests.ps1

      - name: Run PowerShell 7 rule-pack trust tests
        shell: pwsh
        run: ./Tests/RulePackTrust.Tests.ps1

      - name: Run Windows PowerShell 5.1 rule-pack trust tests
        shell: powershell
        run: ./Tests/RulePackTrust.Tests.ps1

      - name: Run PowerShell 7 scanner diagnostics tests
        shell: pwsh
        run: ./Tests/ScannerDiagnostics.Tests.ps1

      - name: Run Windows PowerShell 5.1 scanner diagnostics tests
        shell: powershell
        run: ./Tests/ScannerDiagnostics.Tests.ps1

      - name: Run PowerShell 7 quarantine integrity tests
        shell: pwsh
        run: ./Tests/QuarantineIntegrity.Tests.ps1

      - name: Run Windows PowerShell 5.1 quarantine integrity tests
        shell: powershell
        run: ./Tests/QuarantineIntegrity.Tests.ps1

      - name: Run PowerShell 7 pending ledger tests
        shell: pwsh
        run: ./Tests/PendingLedger.Tests.ps1

      - name: Run Windows PowerShell 5.1 pending ledger tests
        shell: powershell
        run: ./Tests/PendingLedger.Tests.ps1

      - name: Run PowerShell 7 System Integrity tests
        shell: pwsh
        run: ./Tests/SystemIntegrity.Tests.ps1

      - name: Run Windows PowerShell 5.1 System Integrity tests
        shell: powershell
        run: ./Tests/SystemIntegrity.Tests.ps1

      - name: Run PowerShell 7 signed rule update tests
        shell: pwsh
        run: ./Tests/RuleUpdates.Tests.ps1

      - name: Run Windows PowerShell 5.1 signed rule update tests
        shell: powershell
        run: ./Tests/RuleUpdates.Tests.ps1

      - name: Run PowerShell 7 incident bundle tests
        shell: pwsh
        run: ./Tests/IncidentBundle.Tests.ps1

      - name: Run Windows PowerShell 5.1 incident bundle tests
        shell: powershell
        run: ./Tests/IncidentBundle.Tests.ps1

      - name: Run Windows PowerShell 5.1 full mode regression tests
        shell: powershell
        run: ./Tests/FullRegression.Tests.ps1
