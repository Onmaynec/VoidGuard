name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run PowerShell 7 parser and smoke tests
        shell: pwsh
        run: ./Tests/Smoke.Tests.ps1

      - name: Run Windows PowerShell 5.1 package compatibility tests
        shell: powershell
        run: ./Tests/PackageCompatibility.Tests.ps1
